<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Jelly Ping</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #d9e4d4;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  button { font-family: inherit; }

  .app {
    max-width: 480px; margin: 0 auto; min-height: 100vh;
    background: #f4f7f3; color: #1e2b22; position: relative;
    padding-bottom: calc(128px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }

  /* 헤더 */
  .header { padding: 18px 18px 14px; background: #ffffff; border-bottom: 1px solid #eef2ec; }
  .brandRow { display: flex; align-items: center; gap: 8px; }
  .brandMark { width: 5px; height: 20px; border-radius: 3px; background: linear-gradient(#5fa9d6, #2f7fae); }
  .title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #16321f; line-height: 1.1; }
  .sub { font-size: 12px; color: #6b8272; margin-top: 5px; font-weight: 500; }

  /* 시뮬레이션 시계 */
  .clockBar { display: flex; align-items: center; gap: 6px; background: #eef6ef;
    margin: 4px 18px 0; border-radius: 12px; padding: 8px 10px; flex-wrap: wrap; }
  .clockBtn { min-width: 30px; height: 30px; border-radius: 8px; border: none; background: #ffffff;
    color: #16321f; font-size: 13px; cursor: pointer; box-shadow: 0 1px 2px rgba(20,40,25,0.12); padding: 0 8px; }
  .clockBtn:active { transform: scale(0.95); }
  .clockStepBtn { font-size: 11.5px; font-weight: 700; }
  .clockReadout { display: flex; flex-direction: column; line-height: 1.25; margin-right: auto; }
  .clockTime { font-size: 13.5px; font-weight: 800; color: #16321f; }
  .clockScale { font-size: 10.5px; color: #6b8272; font-weight: 600; }

  /* 요약 스탯 바 */
  .statBar { display: flex; align-items: center; background: #ffffff; padding: 12px 18px 14px;
    border-bottom: 1px solid #e2e9df; margin-top: 4px; }
  .statItem { display: flex; align-items: baseline; gap: 5px; flex: 1; }
  .statDot { width: 7px; height: 7px; border-radius: 50%; margin-right: 1px; display: inline-block; }
  .statNum { font-size: 16px; font-weight: 800; color: #16321f; }
  .statLabel { font-size: 11px; color: #6b8272; font-weight: 600; }
  .statDivider { width: 1px; height: 22px; background: #e2e9df; margin: 0 6px; }

  /* 지도 (카카오맵) */
  .hint { font-size: 12px; color: #5c7565; padding: 14px 18px 8px; font-weight: 600; }
  .mapWrap { position: relative; margin: 0 14px; border-radius: 18px; overflow: hidden;
    border: 3px solid #ffffff; box-shadow: 0 4px 20px rgba(30,60,40,0.15); aspect-ratio: 1 / 1;
    background: #cfe3ee; }
  #kakaoMap { width: 100%; height: 100%; }
  .mapLoading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; color: #5c7565; font-weight: 600; text-align: center; padding: 20px; line-height: 1.6; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 12px 18px 18px; font-size: 12px;
    color: #4a5f52; font-weight: 600; align-items: center; }
  .legendItem { display: flex; align-items: center; gap: 6px; }
  .legendDot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .legendLine { width: 14px; height: 0; border-top: 1.6px dashed #2f7fae; display: inline-block; }

  /* 지도 위 핀 (카카오 CustomOverlay 내부 HTML) */
  .kPin { position: relative; width: 26px; height: 26px; cursor: pointer; }
  .kPinPulse { position: absolute; inset: 0; border-radius: 50%; opacity: 0; }
  .kPinPulse.on { animation: kpulse 1.8s ease-out infinite; }
  @keyframes kpulse { 0% { transform: scale(0.7); opacity: 0.45; } 100% { transform: scale(2.1); opacity: 0; } }
  .kPinDriftRing { position: absolute; inset: -4px; border-radius: 50%; border: 1.6px dashed #2f7fae; opacity: 0; }
  .kPinDriftRing.on { opacity: 0.6; animation: kspin 3s linear infinite; }
  @keyframes kspin { to { transform: rotate(360deg); } }
  .kPinWhite { position: absolute; inset: 3px; border-radius: 50%; background: #fff; }
  .kPinFill { position: absolute; inset: 3px; border-radius: 50%; opacity: 0.92; }
  .kPinCenter { position: absolute; inset: 10px; border-radius: 50%; background: #fff; }

  /* 안전요원 부스 가정 위치 (빨간 점) */
  .lgSpot { position: relative; width: 16px; height: 16px; }
  .lgSpotDot { position: absolute; inset: 4px; border-radius: 50%; background: #e0402f;
    border: 2px solid #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
  .lgSpotPulse { position: absolute; inset: 0; border-radius: 50%; background: #e0402f;
    opacity: 0.5; animation: lgspotpulse 1.6s ease-out infinite; }
  @keyframes lgspotpulse { 0% { transform: scale(0.6); opacity: 0.55; } 100% { transform: scale(2.2); opacity: 0; } }

  /* 내 위치(파란 점) — 해변/구역 마커와 완전히 분리된 실시간 GPS 표시 */
  .myLocDot { position: relative; width: 16px; height: 16px; }
  .myLocCore { position: absolute; inset: 3px; border-radius: 50%; background: #2f7fae;
    border: 2px solid #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
  .myLocPulse { position: absolute; inset: 0; border-radius: 50%; background: #2f7fae;
    opacity: 0.45; animation: mylocpulse 1.8s ease-out infinite; }
  @keyframes mylocpulse { 0% { transform: scale(0.6); opacity: 0.5; } 100% { transform: scale(2.4); opacity: 0; } }
  .kPinSelected { position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #16321f; opacity: 0; }
  .kPinSelected.on { opacity: 1; }

  /* 지도 위 신고 선택 안내 배너 */
  /* 신고 모달 내 미니맵 */
